<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create account · SubTrack</title>
  <link rel="stylesheet" href="style.css">
  <script src="config.js" defer></script>
  <script src="js/api.js" defer></script>
  <script src="js/register.js" defer></script>
</head>
<body>
  <main class="auth-shell">
    <section class="auth-card">
      <div class="auth-brand">
      <span class="brand-mark">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17 2l4 4-4 4"/><path d="M3 11V9a3 3 0 0 1 3-3h15"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v2a3 3 0 0 1-3 3H3"/></svg>
      </span>
        SubTrack
      </div>
      <h1>Create your account</h1>
      <p class="subtitle">Your subscriptions stay private to your account.</p>

      <div id="messages"></div>

      <form id="register-form" class="auth-form">
        <div class="field">
          <label for="email">Email</label>
          <input id="email" type="email" name="email" autocomplete="email" placeholder="name@example.com" required autofocus>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" type="password" name="password" autocomplete="new-password" minlength="8" required>
          <small>At least 8 characters.</small>
        </div>
        <div class="field">
          <label for="confirm_password">Repeat password</label>
          <input id="confirm_password" type="password" name="confirm_password" autocomplete="new-password" required>
        </div>
        <button type="submit" class="button full">Create account</button>
      </form>

      <p class="auth-switch">Already have an account? <a href="login.html">Log in</a></p>
    </section>
  </main>
</body>
</html>
