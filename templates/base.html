<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}SubTrack{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <a class="brand" href="{{ url_for('home') }}">
        <span class="brand-mark">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17 2l4 4-4 4"/><path d="M3 11V9a3 3 0 0 1 3-3h15"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v2a3 3 0 0 1-3 3H3"/></svg>
        </span>
        <span class="brand-name">SubTrack</span>
      </a>

      <nav class="nav">
        <a class="nav-link {% if request.endpoint == 'subscriptions.list_page' %}active{% endif %}"
           href="{{ url_for('subscriptions.list_page') }}">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M3 10h18"/><path d="M7 15h4"/></svg>
          Subscriptions
        </a>
        <a class="nav-link {% if request.endpoint == 'subscriptions.add_page' %}active{% endif %}"
           href="{{ url_for('subscriptions.add_page') }}">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v8"/><path d="M8 12h8"/></svg>
          Add subscription
        </a>
      </nav>

      <p class="sidebar-note">Know what you pay for.<br>Keep what you use.</p>
    </aside>

    <main class="content">
      {% block content %}{% endblock %}
    </main>
  </div>
</body>
</html>
