{% extends "base.html" %}
{% block title %}Log in · SubTrack{% endblock %}

{% block content %}
<section class="auth-card">
  <div class="auth-brand">
    <span class="brand-mark">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17 2l4 4-4 4"/><path d="M3 11V9a3 3 0 0 1 3-3h15"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v2a3 3 0 0 1-3 3H3"/></svg>
    </span>
    SubTrack
  </div>
  <h1>Welcome back</h1>
  <p class="subtitle">Log in to see what you pay for.</p>

  {% if error %}
  <div class="notice error">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v6"/><path d="M12 16.5v.5"/></svg>
    <span>{{ error }}</span>
  </div>
  {% endif %}

  <form method="post" class="auth-form">
    <div class="field">
      <label for="email">Email</label>
      <input id="email" type="email" name="email" value="{{ form.get('email', '') }}"
             autocomplete="email" placeholder="name@example.com" required autofocus>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input id="password" type="password" name="password" autocomplete="current-password" required>
    </div>
    <button type="submit" class="button full">Log in</button>
  </form>

  <p class="auth-switch">No account yet? <a href="{{ url_for('accounts.register_page') }}">Create one</a></p>
</section>
{% endblock %}
